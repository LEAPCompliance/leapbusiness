    <rect width="88" height="50" rx="10" fill="#FFFFFF" stroke="#1A4F78" stroke-opacity="0.25" stroke-width="2"/>
    <rect width="88" height="16" rx="10" fill="#1A4F78"/>
    <rect y="8" width="88" height="8" fill="#1A4F78"/>
    <circle cx="20" cy="34" r="5" fill="#3299C2"/>
    <circle cx="44" cy="34" r="5" fill="#1A4F78" opacity="0.25"/>
    <circle cx="68" cy="34" r="5" fill="#1A4F78" opacity="0.25"/>
  </g>

  <path d="M40 316 H440" stroke="#1A4F78" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
