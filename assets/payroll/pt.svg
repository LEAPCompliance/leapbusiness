    <rect x="68" y="134" width="176" height="12" rx="3" fill="#1A4F78"/>
    <rect x="80" y="150" width="20" height="90" rx="4" fill="#3299C2"/>
    <rect x="118" y="150" width="20" height="90" rx="4" fill="#3299C2"/>
    <rect x="174" y="150" width="20" height="90" rx="4" fill="#3299C2"/>
    <rect x="212" y="150" width="20" height="90" rx="4" fill="#3299C2"/>
    <rect x="66" y="244" width="180" height="12" rx="3" fill="#1A4F78"/>
    <rect x="54" y="258" width="204" height="14" rx="3" fill="#1A4F78" opacity="0.8"/>
  </g>

  <!-- pay slip / return document -->
  <g transform="translate(290 46)">
    <rect width="152" height="200" rx="12" fill="#FFFFFF" stroke="#1A4F78" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="18" y="20" width="70" height="9" rx="4.5" fill="#1A4F78"/>
    <rect x="18" y="40" width="116" height="6" rx="3" fill="#1A4F78" opacity="0.2"/>
    <rect x="18" y="56" width="116" height="6" rx="3" fill="#1A4F78" opacity="0.2"/>
    <rect x="18" y="72" width="90" height="6" rx="3" fill="#1A4F78" opacity="0.2"/>
    <path d="M18 98 H134" stroke="#1A4F78" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 5"/>
    <rect x="18" y="112" width="52" height="8" rx="4" fill="#1A4F78" opacity="0.5"/>
    <rect x="98" y="112" width="36" height="8" rx="4" fill="#3299C2"/>
    <rect x="18" y="130" width="52" height="8" rx="4" fill="#1A4F78" opacity="0.5"/>
    <rect x="98" y="130" width="36" height="8" rx="4" fill="#3299C2"/>
