<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF4FA"/>
      <stop offset="1" stop-color="#D5E9F4"/>
    </linearGradient>
  </defs>
  <rect width="480" height="340" rx="20" fill="url(#bg)"/>
  <circle cx="52" cy="50" r="32" fill="#3299C2" opacity="0.12"/>
  <circle cx="440" cy="296" r="46" fill="#1A4F78" opacity="0.07"/>

  <!-- state building -->
  <g>
    <path d="M60 128 L156 64 L252 128 Z" fill="#1A4F78"/>
